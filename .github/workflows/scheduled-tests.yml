name: Testes Cypress - Formulario de Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'
      timezone: 'America/Sao_Paulo'

jobs:
  testes-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar os testes Cypress
        run: npm test

      - name: Salvar evidencias em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
